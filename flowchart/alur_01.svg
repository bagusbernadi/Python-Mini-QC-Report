<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 700" width="580" role="img" aria-label="Alur pekerjaan Project 1: dari data output per stasiun sampai laporan yield dan grade"><title>Alur pekerjaan Project 1: dari data output per stasiun sampai laporan yield dan grade</title><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="580" height="700" fill="#ffffff"/><rect x="55.0" y="16.0" width="270" height="48" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="190" y="36.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Data mentah: file output per</text><text x="190" y="52.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">stasiun dan shift (Excel)</text><rect x="55.0" y="94.0" width="270" height="48" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="190" y="114.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Gabung baris per lot, cek</text><text x="190" y="130.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Input = Good + NG + Rework</text><rect x="55.0" y="172.0" width="270" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="190" y="192.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Hitung yield =</text><text x="190" y="208.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">good ÷ total × 100</text><polygon points="190,254.0 295.0,296 190,338.0 85.0,296" fill="#fef7e0" stroke="#b06000" stroke-width="1.5"/><text x="190" y="300.5" text-anchor="middle" font-family