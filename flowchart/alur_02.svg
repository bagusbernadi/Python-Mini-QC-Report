<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 550" width="420" role="img" aria-label="Alur pekerjaan Project 2: dari log NG sampai grafik Pareto"><title>Alur pekerjaan Project 2: dari log NG sampai grafik Pareto</title><defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="420" height="550" fill="#ffffff"/><rect x="25.0" y="16.0" width="370" height="48" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="210" y="36.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Data mentah: log NG operator /</text><text x="210" y="52.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">log rework (Excel)</text><rect x="25.0" y="94.0" width="370" height="48" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="210" y="114.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Seragamkan nama defect (goresan, Scratch → scratch)</text><text x="210" y="130.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">dan buang catatan ganda</text><rect x="25.0" y="172.0" width="370" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="210" y="192.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Hitung frekuensi tiap defect</text><text x="210" y="208.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">(dict: nama → jumlah)</text><rect x="25.0" y="250.0" width="370" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="210" y="270.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Urutkan dari terbanyak ke tersedikit</text><text x="210" y="286.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">(perulangan bersarang)</text><rect x="25.0" y="336.0" width="370" height="32" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="210" y="356.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Hitung persen dan persen kumulatif</text><rect x="25.0" y="406.0" width="370" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="210" y="426.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Tandai defect &quot;vital few&quot; sampai</text><text x="210" y="442.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">kumulatif melewati 80%</text><rect x="25.0" y="492.0" width="370" height="32" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="210" y="512.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">Cetak tabel + bar teks, buat grafik Pareto</text><polyline points="210,64.0 210,94.0" fill="none" stroke="#52514e" stroke-width="1.5"  marker-end="url(#m2)"/><polyline points="210,142.0 210,172.0" fill="none" stroke="#52514e" stroke-width="1.5"  marker-end="url(#m2)"/><polyline points="210,220.0 210,250.0" fill="none" stroke="#52514e" stroke-width="1.5"  marker-end="url(#m2)"/><polyline points="210,298.0 210,336.0" fill="none" stroke="#52514e" stroke-width="1.5"  marker-end="url(#m2)"/><polyline points="210,368.0 210,406.0" fill="none" stroke="#52514e" stroke-width="1.5"  marker-end="url(#m2)"/><polyline points="210,454.0 210,492.0" fill="none" stroke="#52514e" stroke-width="1.5"  marker-end="url(#m2)"/></svg>